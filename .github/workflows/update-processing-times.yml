name: Update USCIS Processing Times

on:
  # Run every Monday at 09:00 UTC
  schedule:
    - cron: "0 9 * * 1"
  # Allow manual trigger from GitHub Actions UI
  workflow_dispatch:

jobs:
  update:
    name: Fetch and commit updated processing times
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Fetch USCIS processing times
        run: node scripts/update-processing-times.mjs

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet data/processing-times.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit updated data
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/processing-times.json
          git commit -m "chore: update USCIS processing times [$(date +%Y-%m-%d)]"
          git push

      - name: No changes
        if: steps.diff.outputs.changed == 'false'
        run: echo "Processing times unchanged — no commit needed."
